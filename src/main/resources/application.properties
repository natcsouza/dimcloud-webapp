spring.application.name=dimcloud
server.port=${PORT:8080}

# Conexão com o Azure SQL Database.
# Os valores reais vêm das App Settings do Web App (variáveis de ambiente
# SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD). Nada sensível aqui.
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.maximum-pool-size=5

# As tabelas são criadas pelo DDL (scripts/ddl.sql); o Hibernate só valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info
