<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Correntistas')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('correntistas')}"></header>
<main class="conteudo">
    <div class="titulo-linha">
        <h1>Correntistas <small>TB_CORRENTISTA</small></h1>
        <a class="btn" th:href="@{/correntistas/novo}">+ Novo correntista</a>
    </div>
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <p class="vazio" th:if="${#lists.isEmpty(correntistas)}">Nenhum correntista cadastrado.</p>
    <div class="tabela-wrap" th:unless="${#lists.isEmpty(correntistas)}">
        <table>
            <thead><tr><th>ID</th><th>Nome</th><th>CPF</th><th>E-mail</th><th>Telefone</th><th class="num">Saldo</th><th></th></tr></thead>
            <tbody>
            <tr th:each="c : ${correntistas}">
                <td th:text="${c.id}"></td>
                <td th:text="${c.nome}"></td>
                <td th:text="${c.cpf}"></td>
                <td th:text="${c.email}"></td>
                <td th:text="${c.telefone}"></td>
                <td class="num" th:text="${'R$ ' + #numbers.formatDecimal(c.saldo, 1, 'POINT', 2, 'COMMA')}"></td>
                <td class="acoes-linha">
                    <a th:href="@{/transacoes(correntista=${c.id})}">Extrato</a>
                    <a th:href="@{/correntistas/{id}/editar(id=${c.id})}">Editar</a>
                    <form th:action="@{/correntistas/{id}/excluir(id=${c.id})}" method="post"
                          onsubmit="return confirm('Excluir o correntista e todas as transações dele?')">
                        <button type="submit" class="link-perigo">Excluir</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
