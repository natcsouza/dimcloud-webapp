<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Transações')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('transacoes')}"></header>
<main class="conteudo">
    <div class="titulo-linha">
        <h1>Transações <small>TB_TRANSACAO</small></h1>
        <a class="btn" th:href="@{/transacoes/nova(correntista=${filtro})}">+ Nova transação</a>
    </div>
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <form th:action="@{/transacoes}" method="get" class="filtro">
        <label>Correntista
            <select name="correntista" onchange="this.form.submit()">
                <option value="">Todos</option>
                <option th:each="c : ${correntistas}" th:value="${c.id}" th:text="${c.nome}"
                        th:selected="${filtro == c.id}"></option>
            </select>
        </label>
    </form>

    <p class="vazio" th:if="${#lists.isEmpty(transacoes)}">Nenhuma transação encontrada.</p>
    <div class="tabela-wrap" th:unless="${#lists.isEmpty(transacoes)}">
        <table>
            <thead><tr><th>ID</th><th>Data</th><th>Correntista</th><th>Tipo</th><th>Descrição</th><th class="num">Valor</th><th></th></tr></thead>
            <tbody>
            <tr th:each="t : ${transacoes}">
                <td th:text="${t.id}"></td>
                <td th:text="${#temporals.format(t.dataTransacao, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${t.correntista.nome}"></td>
                <td><span class="tag" th:classappend="${t.tipo.credito} ? 'cred' : 'deb'" th:text="${t.tipo.descricao}"></span></td>
                <td th:text="${t.descricao}"></td>
                <td class="num" th:text="${(t.tipo.credito ? '+ ' : '- ') + 'R$ ' + #numbers.formatDecimal(t.valor, 1, 'POINT', 2, 'COMMA')}"></td>
                <td class="acoes-linha">
                    <a th:href="@{/transacoes/{id}/editar(id=${t.id})}">Editar</a>
                    <form th:action="@{/transacoes/{id}/excluir(id=${t.id})}" method="post"
                          onsubmit="return confirm('Excluir esta transação?')">
                        <button type="submit" class="link-perigo">Excluir</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
